<div class="ua-wrapper" [class]="'ua-' + size" [class.ua-verified]="verified">

  <!-- === Real profile picture === -->
  <img
    *ngIf="showImage"
    [src]="src!"
    [alt]="username || 'User'"
    class="ua-img"
    (error)="onImgError()"
  />

  <!-- === Default cosmic SVG avatar (no photo) === -->
  <svg
    *ngIf="!showImage"
    class="ua-svg"
    viewBox="0 0 100 100"
    xmlns="http://www.w3.org/2000/svg"
    aria-label="Default avatar"
  >
    <defs>
      <!-- Background gradient -->
      <linearGradient [id]="gradientId" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" [attr.stop-color]="gradientStart" />
        <stop offset="100%" [attr.stop-color]="gradientEnd" />
      </linearGradient>

      <!-- Stars pattern -->
      <pattern [id]="'stars-' + gradientId" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="3"  cy="7"  r="0.8" fill="rgba(255,255,255,0.5)" />
        <circle cx="15" cy="3"  r="0.5" fill="rgba(255,255,255,0.4)" />
        <circle cx="10" cy="14" r="0.6" fill="rgba(255,255,255,0.35)" />
        <circle cx="18" cy="16" r="0.4" fill="rgba(255,255,255,0.3)" />
        <circle cx="6"  cy="18" r="0.7" fill="rgba(255,255,255,0.45)" />
      </pattern>

      <!-- Clip to circle -->
      <clipPath [id]="'clip-' + gradientId">
        <circle cx="50" cy="50" r="50" />
      </clipPath>
    </defs>

    <!-- Background fill -->
    <circle cx="50" cy="50" r="50" [attr.fill]="'url(#' + gradientId + ')'" />

    <!-- Star field overlay -->
    <rect
      x="0" y="0" width="100" height="100"
      [attr.fill]="'url(#stars-' + gradientId + ')'"
      [attr.clip-path]="'url(#clip-' + gradientId + ')'"
    />

    <!-- Subtle nebula glow -->
    <circle cx="30" cy="35" r="22" fill="rgba(255,255,255,0.06)" />
    <circle cx="72" cy="68" r="18" fill="rgba(0,0,0,0.12)" />

    <!-- Person silhouette (head + body) -->
    <circle cx="50" cy="38" r="16" fill="rgba(255,255,255,0.25)" />
    <ellipse cx="50" cy="80" rx="22" ry="16" fill="rgba(255,255,255,0.2)" />

    <!-- Initials text -->
    <text
      x="50"
      y="44"
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="'Outfit', 'Inter', sans-serif"
      font-weight="700"
      font-size="22"
      fill="rgba(255,255,255,0.95)"
      letter-spacing="1"
    >{{ initials }}</text>

    <!-- Outer glow ring -->
    <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  </svg>

  <!-- Verified badge -->
  <span *ngIf="verified" class="ua-badge material-icons" title="Verified">verified</span>
</div>
